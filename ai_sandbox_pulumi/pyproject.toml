[project]
name = "ai_sandbox_pulumi"
version = "0.1.0"
description = "Project ODIN - State-Driven Polymorphic Cortex Engine with Hardened Persistence Mesh"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]

# 🚀 PURIFICACIÓN DE CONSOLA: Ignora los warnings remanentes en las capas de Python
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

# 🚀 INYECCIÓN CORE DE LOGS EN KERNEL/RUST: Fuerza a que LanceDB enmudezca sus trazas WARN
env = [
    "RUST_LOG=error",
    "LANCE_LOG=error"
]
