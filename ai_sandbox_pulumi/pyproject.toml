[tool.poetry]
name = "ai-sandbox-pulumi"
version = "0.1.0"
description = "PoC Autónoma de AI-Ops y Self-Healing con Pulumi e IA"
authors = ["Edith Barrientos"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.7.0"
lancedb = "*"
mcp = "*"
duckdb = "*"
loguru = "^0.7.2"
pydantic-settings = "^2.2.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.10.0"
ruff = "^0.4.0"
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"

[tool.mypy]
strict = true
mypy_path = "src"                  # Fuerza a Mypy a buscar las raíces adentro de src/
no_namespace_packages = true       # Se guía únicamente por los archivos __init__.py

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
